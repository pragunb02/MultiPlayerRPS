# Dependency updates (CC-031). Every update is a pull request that must pass CI before merging — and merging deploys
# (docs/DEPLOYMENT.md), so read each one's deployment impact. Dependabot only proposes stable releases, which is
# our policy (docs/ENGINEERING.md §5).
version: 2
updates:
  - package-ecosystem: npm
    directory: / # one lockfile for every workspace
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Patch and minor releases of dev tools in one PR a week; runtime ones in another, to review them separately.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      # Major releases come one per PR: each may need code changes and a migration note.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker # base image in the Dockerfile (Node)
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "docker"
    ignore:
      # Node majors follow the Active LTS line together with .nvmrc (ENGINEERING.md §5) — odd "Current" releases
      # never; the next LTS by a deliberate PR. Patch and minor images still come here.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose # MongoDB image for local development
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "docker"
    ignore:
      # MongoDB 8.3 and later exit at start on GitHub's Ubuntu 7.0 kernels (CC-288, SERVER-136848). The Docker job
      # would fail on every such update. Move past 8.2 by a deliberate PR once MongoDB fixes its kernel check.
      - dependency-name: mongo
        versions: [">= 8.3"]
