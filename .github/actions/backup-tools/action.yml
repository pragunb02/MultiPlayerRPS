# Installs the tools the backup and its round trip test use: mongodump and mongorestore (MongoDB Database Tools)
# and age. Shared by .github/workflows/backup.yml and the CI round trip job, so both run the same versions.
# The Database Tools archive is checked against the SHA 256 that MongoDB publishes at
# https://downloads.mongodb.org/tools/db/release.json, and age comes from Ubuntu's signed package archive.
# To upgrade: take the new version's ubuntu2404 x86_64 tgz url and sha256 from that file.
name: Backup tools
description: MongoDB Database Tools and age, on Ubuntu 24.04 x86_64
runs:
  using: composite
  steps:
    - name: Install MongoDB Database Tools and age
      shell: bash
      env:
        TOOLS_URL: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.19.1.tgz
        TOOLS_SHA256: f34b84a67ab96b4ff52571ec5d15e2148d96cb140b1ea9ef8c29ac33c48e3480
      run: |
        set -euo pipefail
        tools_dir="$RUNNER_TEMP/mongodb-database-tools"
        mkdir -p "$tools_dir"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/tools.tgz" "$TOOLS_URL"
        echo "$TOOLS_SHA256  $RUNNER_TEMP/tools.tgz" | sha256sum --check --strict
        tar --extract --gzip --file "$RUNNER_TEMP/tools.tgz" --directory "$tools_dir" --strip-components 1
        echo "$tools_dir/bin" >> "$GITHUB_PATH"
        sudo apt-get update --quiet
        sudo apt-get install --yes --quiet --no-install-recommends age
        "$tools_dir/bin/mongodump" --version | head -n 1
        age --version
