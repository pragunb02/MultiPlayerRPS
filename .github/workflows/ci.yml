# Every pull request and every push to main must pass these before it can reach production (Render deploys main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, audit, unit + integration (coverage gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary (integration tests)
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  backup-round-trip:
    name: Backup round trip (mongodump, age, mongorestore)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: ./.github/actions/backup-tools
      # Test data only. A missing tool fails the test here instead of skipping it.
      - run: npx vitest run scripts/backup/roundTrip.integration.test.mjs
        env:
          REQUIRE_BACKUP_TOOLS: "1"

  workflows:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint, with shellcheck on every run block
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck on the backup script
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo --entrypoint shellcheck rhysd/actionlint:1.7.12
          scripts/backup/dump-and-encrypt.sh

  e2e:
    name: Browser persona tests (desktop + mobile)
    runs-on: ubuntu-latest
    # The suite takes about 18 minutes today, so 20 cancels it as tests are added. 30 until CC-236 makes it fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Builds the web app, then starts the real server in production config (e2e/playwright.config.js).
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Playwright report and failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    name: Docker image builds and serves (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the app with MongoDB, wait until both are healthy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Health, a page and the API answer
        run: |
          curl --fail --silent http://localhost:4000/health | grep '"database":"up"'
          curl --fail --silent --output /dev/null http://localhost:4000/games/chess
          curl --fail --silent http://localhost:4000/api/session | grep '"authenticated":false'
      - name: Runs as an unprivileged user
        run: test "$(docker compose exec -T app whoami)" = node
      - name: Server log on failure
        if: failure()
        run: docker compose logs app
      - run: docker compose down --volumes
        if: always()
