# Every pull request and every push to main must pass these before it can reach production (Render deploys main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each commit on main gets a group of its own, so no run on main
# is cancelled or replaced by the next merge's, every merge's browser tests finish, and the every-10th-merge stop
# (ADR-039) can see them (CC-236). One group per branch would keep only the newest waiting run on main.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format, audit, unit + integration (coverage gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary (integration tests)
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      # Leaves out the tests tagged slow (long bot games). nightly.yml runs every test (CC-203).
      - run: npm run test:coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  backup-round-trip:
    name: Backup round trip (mongodump, age, mongorestore)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: ./.github/actions/backup-tools
      # Test data only. A missing tool fails the test here instead of skipping it.
      - run: npx vitest run scripts/backup/roundTrip.integration.test.mjs
        env:
          REQUIRE_BACKUP_TOOLS: "1"

  workflows:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint, with shellcheck on every run block
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck on the backup script
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo --entrypoint shellcheck rhysd/actionlint:1.7.12
          scripts/backup/dump-and-encrypt.sh

  # The browser suite runs in parts on separate machines, so it takes minutes instead of 20 (CC-236). Each part is
  # a list of whole spec files balanced by time (e2e/shards.js). The restart tests stop the server, so they have
  # their own job, one test at a time. The last job merges the parts' reports into one, checks that every test
  # ran exactly once and passed, and keeps the old check name, so branch protection can require that one check.
  e2e-parts:
    name: Browser persona tests (desktop + mobile, part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: chromium
      # Builds the web app, then starts the real server in production config (e2e/playwright.config.js). Three
      # workers on these four-CPU machines, measured (CC-236, CI run 39094168823): every 100 ms press check passed
      # and each part's tests took 6 to 7 minutes. Firefox, below, needs two.
      - name: Browser tests, part ${{ matrix.part }} of 4
        working-directory: e2e
        run: npx playwright test --project=desktop --project=mobile --workers=3 --reporter=list,blob
        env:
          CI: "true"
          E2E_SHARD: ${{ matrix.part }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: chromium-part-${{ matrix.part }}.zip
      - name: Report of this part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-chromium-part-${{ matrix.part }}
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-chromium-part-${{ matrix.part }}
          path: e2e/test-results/
          retention-days: 14

  e2e-restarts:
    name: Browser persona tests (desktop + mobile, restarts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: chromium
      # On its own server, so nothing else is cut off. One test at a time, laptop then phone.
      - name: Restart tests
        working-directory: e2e
        run: npx playwright test --project="restart desktop" --project="restart mobile" --no-deps --workers=1 --reporter=list,blob
        env:
          CI: "true"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: chromium-restarts.zip
      - name: Report of the restart tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-chromium-restarts
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-chromium-restarts
          path: e2e/test-results/
          retention-days: 14

  e2e:
    name: Browser persona tests (desktop + mobile)
    needs: [e2e-parts, e2e-restarts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-chromium-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: One report of every part
        working-directory: e2e
        run: npx playwright merge-reports --reporter=html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
      # The parts together ran exactly the tests Playwright lists, each once. The job page shows each file's time.
      - name: Every test ran exactly once, and the time of each file
        working-directory: e2e
        run: |
          npx playwright test --list --reporter=json > listed.json
          node report-summary.mjs "Browser persona tests (desktop + mobile)" listed.json merged.json
        env:
          CI: "true"
      - name: Every part and the restart tests passed
        if: always()
        run: test "$PARTS" = success && test "$RESTARTS" = success
        env:
          PARTS: ${{ needs.e2e-parts.result }}
          RESTARTS: ${{ needs.e2e-restarts.result }}
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # The same suite on Firefox, on a laptop screen (CC-184), in the same parts. Not a required check yet: the owner
  # decides when, after a green streak. WebKit is much slower on GitHub's runners and has its own workflow,
  # webkit.yml.
  e2e-firefox-parts:
    name: Browser persona tests (firefox desktop, part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: firefox
      # Two workers: with three, a press in a chess state answered in 203 ms instead of 100 (CC-236, CI run
      # 39094168823), a busy machine and not the app, which a test must not be loosened for.
      - name: Browser tests, part ${{ matrix.part }} of 4
        working-directory: e2e
        run: npx playwright test --project=firefox --workers=2 --reporter=list,blob
        env:
          CI: "true"
          E2E_BROWSER: firefox
          E2E_SHARD: ${{ matrix.part }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: firefox-part-${{ matrix.part }}.zip
      - name: Report of this part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-firefox-part-${{ matrix.part }}
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-firefox-part-${{ matrix.part }}
          path: e2e/test-results/
          retention-days: 14

  e2e-firefox-restarts:
    name: Browser persona tests (firefox desktop, restarts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: firefox
      - name: Restart tests
        working-directory: e2e
        run: npx playwright test --project="restart firefox" --no-deps --workers=1 --reporter=list,blob
        env:
          CI: "true"
          E2E_BROWSER: firefox
          PLAYWRIGHT_BLOB_OUTPUT_NAME: firefox-restarts.zip
      - name: Report of the restart tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-firefox-restarts
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-firefox-restarts
          path: e2e/test-results/
          retention-days: 14

  e2e-firefox:
    name: Browser persona tests (firefox desktop)
    needs: [e2e-firefox-parts, e2e-firefox-restarts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-firefox-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: One report of every part
        working-directory: e2e
        run: npx playwright merge-reports --reporter=html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
      - name: Every test ran exactly once, and the time of each file
        working-directory: e2e
        run: |
          npx playwright test --list --reporter=json > listed.json
          node report-summary.mjs "Browser persona tests (firefox desktop)" listed.json merged.json
        env:
          CI: "true"
          E2E_BROWSER: firefox
      - name: Every part and the restart tests passed
        if: always()
        run: test "$PARTS" = success && test "$RESTARTS" = success
        env:
          PARTS: ${{ needs.e2e-firefox-parts.result }}
          RESTARTS: ${{ needs.e2e-firefox-restarts.result }}
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-firefox
          path: e2e/playwright-report/
          retention-days: 14

  docker:
    name: Docker image builds and serves (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the app with MongoDB, wait until both are healthy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Health, a page and the API answer
        run: |
          curl --fail --silent http://localhost:4000/health | grep '"database":"up"'
          curl --fail --silent --output /dev/null http://localhost:4000/games/chess
          curl --fail --silent http://localhost:4000/api/session | grep '"authenticated":false'
      - name: Runs as an unprivileged user
        run: test "$(docker compose exec -T app whoami)" = node
      - name: Server log on failure
        if: failure()
        run: docker compose logs app
      # When MongoDB itself fails to start, the reason is only in its own log (CC-288).
      - name: MongoDB log on failure
        if: failure()
        run: docker compose logs mongo
      - run: docker compose down --volumes
        if: always()

  # TEMPORARY probe for CC-288, removed before merge.
  cc288-probe:
    name: CC-288 probe ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Host
        run: |
          uname -a
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -o -w "avx\|avx2\|avx512f" /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          cat /proc/sys/vm/max_map_count
          docker version --format '{{.Server.Version}}'
      - name: Start each candidate image and print its log
        run: |
          for image in mongo:8 mongo:8.2 mongo:8.0 mongo:7.0; do
            echo "::group::$image"
            docker pull -q "$image"
            docker image inspect "$image" --format '{{index .RepoDigests 0}} {{.Config.Env}}'
            docker run -d --name probe "$image" > /dev/null
            sleep 6
            docker ps -a --filter name=probe --format '{{.Status}}'
            docker logs probe 2>&1 | tail -n 25
            docker rm -f probe > /dev/null
            echo "::endgroup::"
          done
