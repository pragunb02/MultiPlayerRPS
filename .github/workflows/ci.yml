# Every pull request and every push to main must pass these before it can reach production (Render deploys main).
name: CI

# Three events (CC-298, ADR-074). A pull request runs everything. The merge queue (`merge_group`) tests the pull
# request on top of main and of the pull requests ahead of it in the queue, on a temporary branch named
# gh-readonly-queue/main/..., and merges only when every required check passed there. A push to main runs it all
# again on the commit Render deploys. What each job does on each event:
#
#   job                                    pull_request  merge_group  push to main
#   checks, backup, actionlint, docker     runs          runs         runs
#   browser suites (Chromium, Firefox)     runs          runs         runs
#   changes (fragments, decision gate)     runs          runs         skipped, nothing to compare with
#   render-blueprint                       runs          skipped      skipped, render.com must never hold back a merge
#   visual-scope and visual (advisory)     runs          skipped      skipped, a pull request question only
#
# A job skipped by its `if` reports success, so a required check that is skipped never blocks the queue. A required
# check must run, or be skipped, on `merge_group` too, or the queue waits for it until its timeout.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each commit on main gets a group of its own, so no run on main
# is cancelled or replaced by the next merge's, every merge's browser tests finish, and the every-10th-merge stop
# (ADR-039) can see them (CC-236). One group per branch would keep only the newest waiting run on main. Each merge
# queue group is a commit of its own too, so it is never cancelled by another: the queue itself drops a group whose
# pull requests changed.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format, audit, unit + integration (coverage gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary (integration tests)
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      # Leaves out the tests tagged slow (long bot games). nightly.yml runs every test (CC-203).
      - run: npm run test:coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  backup-round-trip:
    name: Backup round trip (mongodump, age, mongorestore)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: ./.github/actions/backup-tools
      # Test data only. A missing tool fails the test here instead of skipping it.
      - run: npx vitest run scripts/backup/roundTrip.integration.test.mjs
        env:
          REQUIRE_BACKUP_TOOLS: "1"

  workflows:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint, with shellcheck on every run block
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck on the backup script
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo --entrypoint shellcheck rhysd/actionlint:1.7.12
          scripts/backup/dump-and-encrypt.sh

  # Changelog fragments (CC-299, ADR-068). A pull request adds docs/changes/CC-###.md instead of editing the
  # changelog in docs/PROGRESS.md, so parallel pull requests never conflict there. This fails on a malformed fragment
  # and on a changelog entry added, changed or removed by hand. The coordinator's collector pull request passes
  # because every line it adds is made from a fragment it deletes, which the script checks from the files, so no
  # branch name or label can claim the exception. A pull request's run checks out GitHub's merge of it into main,
  # and the merge's first parent is main as it is now. In the merge queue the commit's first parent is main, or the
  # pull request ahead in the queue, so the check compares exactly this pull request's change there too (CC-298).
  # Not on a push to main: there is nothing to compare.
  changes:
    name: Changelog fragments
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/bin/collect-changes.mjs --check --base HEAD^1
      # The decision gate (CC-311, ADR-072). A ticket at Ready or later has every open decision answered by the owner
      # or past its default day, and at least one acceptance criterion with an id. Older tickets are not checked.
      - name: Tickets at Ready or later pass the decision gate
        run: node scripts/bin/check-tickets.mjs

  # render.yaml against the schema Render publishes (CC-294, ADR-063). It downloads the schema from render.com, so it
  # runs on pull requests only. Render deploys a main commit only when every check on it passed, and a check that
  # fails because render.com is slow must never hold back a deploy. On main this job is skipped, which Render
  # counts as passed. Our own rules for the file are unit tests in the checks job (scripts/renderBlueprint.test.mjs).
  # Skipped in the merge queue for the same reason: the pull request's own run already checked the file (CC-298).
  render-blueprint:
    name: render.yaml matches Render's schema
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/bin/check-render-blueprint.mjs

  # The browser suite runs in parts on separate machines, so it takes minutes instead of 20 (CC-236). Each part is
  # a list of whole spec files balanced by time (e2e/shards.js). The restart tests stop the server, so they have
  # their own job, one test at a time. The last job merges the parts' reports into one, checks that every test
  # ran exactly once and passed, and keeps the old check name, so branch protection can require that one check.
  e2e-parts:
    name: Browser persona tests (desktop + mobile, part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: chromium
      # Builds the web app, then starts the real server in production config (e2e/playwright.config.js). Three
      # workers on these four-CPU machines, measured (CC-236, CI run 39094168823): every 100 ms press check passed
      # and each part's tests took 6 to 7 minutes. Firefox, below, needs two.
      - name: Browser tests, part ${{ matrix.part }} of 4
        working-directory: e2e
        run: npx playwright test --project=desktop --project=mobile --workers=3 --reporter=list,blob
        env:
          CI: "true"
          E2E_SHARD: ${{ matrix.part }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: chromium-part-${{ matrix.part }}.zip
      - name: Report of this part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-chromium-part-${{ matrix.part }}
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-chromium-part-${{ matrix.part }}
          path: e2e/test-results/
          retention-days: 14

  e2e-restarts:
    name: Browser persona tests (desktop + mobile, restarts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: chromium
      # On its own server, so nothing else is cut off. One test at a time, laptop then phone.
      - name: Restart tests
        working-directory: e2e
        run: npx playwright test --project="restart desktop" --project="restart mobile" --no-deps --workers=1 --reporter=list,blob
        env:
          CI: "true"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: chromium-restarts.zip
      - name: Report of the restart tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-chromium-restarts
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-chromium-restarts
          path: e2e/test-results/
          retention-days: 14

  e2e:
    name: Browser persona tests (desktop + mobile)
    needs: [e2e-parts, e2e-restarts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-chromium-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: One report of every part
        working-directory: e2e
        run: npx playwright merge-reports --reporter=html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
      # The parts together ran exactly the tests Playwright lists, each once. The job page shows each file's time.
      - name: Every test ran exactly once, and the time of each file
        working-directory: e2e
        run: |
          npx playwright test --list --reporter=json > listed.json
          node report-summary.mjs "Browser persona tests (desktop + mobile)" listed.json merged.json
        env:
          CI: "true"
      - name: Every part and the restart tests passed
        if: always()
        run: test "$PARTS" = success && test "$RESTARTS" = success
        env:
          PARTS: ${{ needs.e2e-parts.result }}
          RESTARTS: ${{ needs.e2e-restarts.result }}
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # The same suite on Firefox, on a laptop screen (CC-184), in the same parts. Not a required check yet: the owner
  # decides when, after a green streak. WebKit is much slower on GitHub's runners and has its own workflow,
  # webkit.yml.
  e2e-firefox-parts:
    name: Browser persona tests (firefox desktop, part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: firefox
      # Two workers: with three, a press in a chess state answered in 203 ms instead of 100 (CC-236, CI run
      # 39094168823), a busy machine and not the app, which a test must not be loosened for.
      - name: Browser tests, part ${{ matrix.part }} of 4
        working-directory: e2e
        run: npx playwright test --project=firefox --workers=2 --reporter=list,blob
        env:
          CI: "true"
          E2E_BROWSER: firefox
          E2E_SHARD: ${{ matrix.part }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: firefox-part-${{ matrix.part }}.zip
      - name: Report of this part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-firefox-part-${{ matrix.part }}
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-firefox-part-${{ matrix.part }}
          path: e2e/test-results/
          retention-days: 14

  e2e-firefox-restarts:
    name: Browser persona tests (firefox desktop, restarts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-tests-setup
        with:
          browser: firefox
      - name: Restart tests
        working-directory: e2e
        run: npx playwright test --project="restart firefox" --no-deps --workers=1 --reporter=list,blob
        env:
          CI: "true"
          E2E_BROWSER: firefox
          PLAYWRIGHT_BLOB_OUTPUT_NAME: firefox-restarts.zip
      - name: Report of the restart tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-firefox-restarts
          path: e2e/blob-report/
          retention-days: 1
      - name: Failure traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-firefox-restarts
          path: e2e/test-results/
          retention-days: 14

  e2e-firefox:
    name: Browser persona tests (firefox desktop)
    needs: [e2e-firefox-parts, e2e-firefox-restarts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-firefox-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: One report of every part
        working-directory: e2e
        run: npx playwright merge-reports --reporter=html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
      - name: Every test ran exactly once, and the time of each file
        working-directory: e2e
        run: |
          npx playwright test --list --reporter=json > listed.json
          node report-summary.mjs "Browser persona tests (firefox desktop)" listed.json merged.json
        env:
          CI: "true"
          E2E_BROWSER: firefox
      - name: Every part and the restart tests passed
        if: always()
        run: test "$PARTS" = success && test "$RESTARTS" = success
        env:
          PARTS: ${{ needs.e2e-firefox-parts.result }}
          RESTARTS: ${{ needs.e2e-firefox-restarts.result }}
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-firefox
          path: e2e/playwright-report/
          retention-days: 14

  # Whether this pull request changes a file the screens are drawn from (CC-300). The list is the same as the paths
  # that start visual-refresh.yml on main. A pull request that changes none of them cannot change a screen, so a
  # visual difference on it can only mean main's baselines are stale, and the merge that made them stale has already
  # started the refresh. A job of its own, on a plain runner, because the Playwright image has no GitHub CLI.
  # Pull requests only. It only feeds the advisory visual check, which is not required and so has no place in the
  # merge queue, where it would hold runners for a verdict nobody waits on (CC-298).
  visual-scope:
    name: Visual baselines, does this PR change the screens
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      screens: ${{ steps.scope.outputs.screens }}
      refresh: ${{ steps.refresh.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # A pull request's run checks out GitHub's merge of it into main. Its first parent is main as it is now, so the
      # difference from it is exactly what the pull request changes. Anything unexpected counts as changing the
      # screens, so a doubt never hides a real difference.
      - name: Files this pull request changes
        id: scope
        shell: bash
        run: |
          screens=true
          if git rev-parse --verify --quiet HEAD^2 > /dev/null && changed=$(git diff --name-only HEAD^1 HEAD); then
            if ! grep -Eq '^(apps/|packages/|e2e/|package\.json$|package-lock\.json$)' <<< "$changed"; then
              screens=false
            fi
          fi
          echo "screens=$screens" >> "$GITHUB_OUTPUT"
          echo "Changes a file the screens are drawn from: $screens" >> "$GITHUB_STEP_SUMMARY"
      # Only to name it in the message. The verdict never depends on it.
      - name: The open refresh pull request, if there is one
        id: refresh
        shell: bash
        run: |
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head visual-baselines/refresh --base main --state open --json url --jq '.[0].url // ""' || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # Screenshot baselines of the main screens, light and dark, laptop and phone (CC-155). They run inside the pinned
  # Playwright image (VISUAL_IMAGE in scripts/visual/docker.mjs), so the fonts and the browser are the ones the baselines
  # were made with. Advisory: not a required check until the owner decides. It compares with main's baselines.
  # After each merge, visual-refresh.yml proposes main's new images in one pull request (CC-300), so a pull request
  # need not make its own. It may, with the "Visual baselines (update)" workflow on its branch or
  # `npm run test:visual:update`.
  visual:
    name: Visual baselines (advisory)
    # Pull requests only. On a push to main a visual diff would turn main's CI red, and a red main stops every
    # merge, which an advisory check must not do. A PR is compared before it merges, so main loses nothing.
    if: github.event_name == 'pull_request'
    needs: visual-scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-visual-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # A difference does not stop the job here. The verdict, the last step, decides, after the images are kept.
      - name: Compare every screen with its baseline
        id: compare
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test -c playwright.visual.config.js --workers=2
        env:
          CI: "true"
      - name: Visual report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: e2e/visual-report/
          retention-days: 14
      # The expected, actual and diff image of each screen that changed, with a video and a trace of its test.
      - name: Differences, videos and traces
        if: steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: visual-results
          path: e2e/visual-results/
          retention-days: 14
      # A difference fails the check only when this pull request changes the screens. Otherwise the differences are
      # main's stale baselines, not this pull request's doing, and the check passes with a notice (CC-300).
      - name: Verdict
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "$COMPARE" == success ]]; then
            echo "Every screen matches main's baselines." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$COMPARE" != failure ]]; then
            echo "::error title=Visual baselines::the comparison did not run"
            exit 1
          fi
          pending="${REFRESH:-the Visual baselines (refresh) workflow on main opens it}"
          if [[ "$SCREENS" == false ]]; then
            echo "::notice title=Visual baselines::baselines on main are stale; a refresh PR is pending: $pending"
            {
              echo "Baselines on main are stale; a refresh PR is pending: $pending."
              echo
              echo "This pull request changes no file the screens are drawn from, so the differences are main's, not its own."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=Visual baselines::a screen differs from main's baselines. The visual-results artifact has the expected, actual and diff images."
          {
            echo "A screen differs from main's baselines, and this pull request changes files the screens are drawn from."
            echo
            echo "1. Look at the diff images in the visual-results artifact."
            echo "2. A change made on purpose may make its own images with the Visual baselines (update) workflow. Otherwise the refresh after its merge proposes them."
            if [[ -n "$REFRESH" ]]; then
              echo "3. Main's baselines are stale too, and its refresh pull request is open: $REFRESH. Once it is merged, run this check again. What still differs then is this pull request's."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        env:
          COMPARE: ${{ steps.compare.outcome }}
          SCREENS: ${{ needs.visual-scope.outputs.screens }}
          REFRESH: ${{ needs.visual-scope.outputs.refresh }}

  docker:
    name: Docker image builds and serves (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the app with MongoDB, wait until both are healthy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Health, a page and the API answer
        run: |
          curl --fail --silent http://localhost:4000/health | grep '"database":"up"'
          curl --fail --silent --output /dev/null http://localhost:4000/games/chess
          curl --fail --silent http://localhost:4000/api/session | grep '"authenticated":false'
      - name: Runs as an unprivileged user
        run: test "$(docker compose exec -T app whoami)" = node
      - name: Server log on failure
        if: failure()
        run: docker compose logs app
      # When MongoDB itself fails to start, the reason is only in its own log (CC-288).
      - name: MongoDB log on failure
        if: failure()
        run: docker compose logs mongo
      - run: docker compose down --volumes
        if: always()
